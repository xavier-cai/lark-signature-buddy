<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>Lark Signature Buddy · 飞书签名切图</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="shell">
      <input
        id="file-input"
        type="file"
        accept=".jpg,.jpeg,.png,.webp,.gif,.bmp,.ico,.tif,.tiff,.heic,image/*"
        hidden
      />

      <section class="editor-layout">
        <div class="canvas-panel">
          <button class="empty-stage" id="empty-stage" type="button">
            <span class="upload-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5M5 14v3.2A2.8 2.8 0 0 0 7.8 20h8.4a2.8 2.8 0 0 0 2.8-2.8V14" /></svg>
            </span>
            <strong>拖入图片，或点击选择</strong>
            <span>也可以粘贴剪贴板图片</span>
            <small>JPG · PNG/APNG · WEBP · GIF · BMP · ICO · TIFF · HEIC</small>
          </button>

          <div class="canvas-stage" id="canvas-stage" hidden>
            <canvas id="editor-canvas"></canvas>
          </div>

          <div class="file-bar" id="file-bar" hidden>
            <span id="file-detail"></span>
            <div class="file-actions">
              <button class="text-button" id="reset-grid" type="button">重置网格</button>
              <button class="text-button" id="upload-button" type="button">换一张</button>
            </div>
          </div>

          <section class="frame-section" id="frame-section" hidden>
            <div class="section-heading">
              <div>
                <p class="step-label">动图帧</p>
                <h2>选择裁剪参考帧</h2>
              </div>
              <span class="frame-count" id="frame-count"></span>
            </div>
            <div
              class="frame-picker"
              id="frame-picker"
              role="listbox"
              aria-label="动图帧"
            ></div>
          </section>
        </div>

        <aside class="control-panel">
          <section class="control-section grid-section">
            <div class="grid-control-row">
              <div class="grid-heading">
                <p class="step-label">网格</p>
              </div>
              <label>
                <span>列</span>
                <input id="grid-cols" type="number" min="1" max="13" value="2" inputmode="numeric" />
              </label>
              <span class="grid-times" aria-hidden="true">×</span>
              <label>
                <span>行</span>
                <input id="grid-rows" type="number" min="1" max="5" value="2" inputmode="numeric" />
              </label>
            </div>
          </section>

          <section class="control-section gap-settings">
            <div class="gap-control">
              <div class="range-heading">
                <label for="precut-gap-ratio">预裁剪间隔 / 子图边长</label>
                <output id="precut-gap-output">58%</output>
              </div>
              <input id="precut-gap-ratio" type="range" min="0" max="100" value="58" />
            </div>
          </section>

          <details class="advanced-settings">
            <summary>高级设置</summary>
            <div class="advanced-settings-body">
              <section class="control-section">
                <div class="mapping-control">
                  <div>
                    <p class="step-label">色彩映射</p>
                    <strong>适配飞书签名单色遮罩</strong>
                  </div>
                  <label class="switch-control">
                    <input id="color-mapping" type="checkbox" checked />
                    <span aria-hidden="true"></span>
                    <em>开启</em>
                  </label>
                </div>
                <div class="gap-control mapping-gamma-control">
                  <div class="range-heading">
                    <label for="mapping-gamma">映射 Gamma</label>
                    <output id="mapping-gamma-output">1.00</output>
                  </div>
                  <input id="mapping-gamma" type="range" min="0" max="300" step="10" value="100" />
                </div>
              </section>
              <section class="control-section">
                <div class="gap-control">
                  <div class="range-heading">
                    <label for="preview-gap-ratio">预览间隔 / 子图边长</label>
                    <output id="preview-gap-output">58%</output>
                  </div>
                  <input id="preview-gap-ratio" type="range" min="0" max="100" value="58" />
                </div>
                <div class="gap-control preview-scale-control">
                  <div class="range-heading">
                    <label for="preview-scale">预览缩放</label>
                    <output id="preview-scale-output">100%</output>
                  </div>
                  <input id="preview-scale" type="range" min="25" max="300" step="25" value="100" />
                </div>
              </section>
            </div>
          </details>

          <section class="control-section preview-section">
            <div class="section-heading compact">
              <p class="step-label">预览</p>
              <div class="preview-controls">
                <div class="preview-platform" role="group" aria-label="预览平台">
                  <button class="active" data-platform="pc" type="button">PC</button>
                  <button data-platform="mobile" type="button">Mobile</button>
                </div>
                <label class="preview-switch-control">
                  <span>实际大小</span>
                  <input id="preview-actual-size" type="checkbox" checked />
                  <i aria-hidden="true"></i>
                </label>
                <label class="preview-switch-control">
                  <span>遮罩</span>
                  <input id="preview-mask" type="checkbox" checked />
                  <i aria-hidden="true"></i>
                </label>
              </div>
            </div>
            <div class="output-preview" id="output-preview">
              <span>选择图片后显示</span>
            </div>
          </section>

          <div class="notice" id="notice" role="status" aria-live="polite"></div>
          <button class="generate-button" id="generate-button" type="button" disabled>
            <span>生成配置</span>
          </button>
          <section class="config-output" id="config-output" hidden>
            <div>
              <strong>配置字符串</strong>
              <span id="config-detail"></span>
            </div>
            <textarea id="config-text" rows="3" readonly></textarea>
          </section>
        </aside>
      </section>
    </main>

    <script type="module" src="./app.js"></script>
  </body>
</html>
