name: CI

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install pinned security tools
        run: npm run security:install
      - name: Audit secrets in tracked files and Git history
        run: npm run security:audit
      - name: Check pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: node scripts/check-conventional-title.mjs --title "$PR_TITLE"
      - name: Check pull request commits
        if: github.event_name == 'pull_request'
        env:
          COMMIT_RANGE: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
        run: node scripts/check-conventional-title.mjs --range "$COMMIT_RANGE"
      - name: Check pushed commits
        if: github.event_name == 'push'
        env:
          COMMIT_RANGE: ${{ github.event.before }}..${{ github.sha }}
        run: node scripts/check-conventional-title.mjs --range "$COMMIT_RANGE"
      - run: npm run check
