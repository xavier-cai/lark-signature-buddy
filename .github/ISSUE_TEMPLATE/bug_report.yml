name: Bug report
description: Report reproducible incorrect behavior
title: '[Bug]: '
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include Lark credentials or private user images.
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Minimal steps and a sanitized sample image when possible.
    validations:
      required: true
  - type: input
    id: revision
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Browser, operating system, Node version, and input format.
    validations:
      required: true
